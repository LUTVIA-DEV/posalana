<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      font-family: "Montserrat", sans-serif;
      background: #ededed;

    .ti-titulo {
      position: absolute;

    .ti-fila {

    .ti-nombre {
      font-size: 64px;

    }
    .ti-dados { display: flex; gap: 20px; }
    .dado {
      position: relative;
      width: 112px;
      height: 112px;
      border-radius: 22%;
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(60, 60, 59, 0.18);
    }
    .cara {
      position: absolute;
      inset: 0;

      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);

      opacity: 0;
    }
    .cara i { display: block; border-radius: 50%; margin: 14%; }
    .cara i.on { background: #3c3c3b; }
  </style>
  <div id="root" data-composition-id="tirada" data-width="1920" data-height="1080">
    <div id="ti-t1" class="ti-titulo clip" data-start="0" data-duration="2.6">Todos tiran</div>
    <div id="ti-t2" class="ti-titulo clip" data-start="2.6" data-duration="2.4">El tiro más bajo <b>pierde</b></div>
    <div id="ti-sub" class="clip" data-start="3.2" data-duration="1.8">Decide el primer dado</div>
    <div id="ti-tarjeta">
      <div class="ti-fila" id="ti-f1" style="top:30px">
        <div class="ti-avatar" style="background:#ea2a58;color:#ffffff">T</div>
        <div class="ti-nombre">Tano</div>
        <div class="ti-dados"><div class="dado" data-v="2"></div><div class="dado" data-v="5"></div><div class="dado" data-v="1"></div><div class="dado" data-v="3"></div></div>
      </div>
      <div class="ti-fila" id="ti-f2" style="top:210px">
        <div class="ti-avatar" style="background:#00cccc;color:#3c3c3b">R</div>
        <div class="ti-nombre">Rulo</div>
        <div class="ti-dados"><div class="dado" data-v="6"></div><div class="dado" data-v="3"></div><div class="dado" data-v="3"></div><div class="dado" data-v="5"></div></div>
      </div>
      <div class="ti-fila" id="ti-f3" style="top:390px">
        <div class="ti-avatar" style="background:#cc66ff;color:#ffffff">M</div>
        <div class="ti-nombre">Mica</div>
        <div class="ti-dados"><div class="dado" data-v="4"></div><div class="dado" data-v="2"></div><div class="dado" data-v="6"></div><div class="dado" data-v="1"></div></div>
      </div>
      <div class="ti-fila" id="ti-f4" style="top:570px">
        <div class="ti-avatar" style="background:#ffcc00;color:#3c3c3b">J</div>
        <div class="ti-nombre">Juli</div>
        <div class="ti-dados"><div class="dado" data-v="1"></div><div class="dado" data-v="4"></div><div class="dado" data-v="2"></div><div class="dado" data-v="6"></div></div>
      </div>
    </div>
  </div>
  <script>
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    document.querySelectorAll("#ti-tarjeta .dado").forEach((d) => {
      d.innerHTML = [1, 2, 3, 4, 5, 6]
        .map((n) => {
          let h = "";
          for (let i = 0; i < 9; i++) h += PIPS[n].includes(i) ? '<i class="on"></i>' : "<i></i>";
          return `<div class="cara c${n}">${h}</div>`;
        })
        .join("");
    });

    const tl = gsap.timeline({ paused: true });
    // Cara nueva cada 2 frames con una secuencia sembrada: misma tirada en cada render
    function rodar(d, t0, t1, semilla) {
      let s = semilla;
      const caras = d.querySelectorAll(".cara");
      for (let t = t0; t < t1; t += 2 / 30) {
        s = (s * 9301 + 49297) % 233280;
        tl.set(caras, { opacity: 0 }, t);
        tl.set(d.querySelector(".c" + (1 + Math.floor((s / 233280) * 6))), { opacity: 1 }, t);
      }
      tl.set(caras, { opacity: 0 }, t1);
      tl.set(d.querySelector(".c" + d.dataset.v), { opacity: 1 }, t1);
    }

    tl.fromTo("#ti-t1", { scale: 1.15 }, { scale: 1, duration: 0.27, ease: "back.out(2.2)" }, 0);
    tl.fromTo("#ti-tarjeta", { y: 900 }, { y: 0, duration: 0.4, ease: "power4.out" }, 0);
    for (let f = 1; f <= 4; f++) {
      const fin = 1.5 + (f - 1) * 0.25;
      document.getElementById("ti-f" + f).querySelectorAll(".dado").forEach((d, k) => {
        rodar(d, 0, fin, f * 31 + k * 7 + 3);
        tl.fromTo(d, { rotation: -14 }, { rotation: 14, duration: 0.1, ease: "none", repeat: Math.round(fin / 0.1) - 1, yoyo: true }, 0);
        tl.to(d, { rotation: 0, duration: 0.01 }, fin);
        tl.fromTo(d, { scale: 1.2 }, { scale: 1, duration: 0.27, ease: "back.out(2.2)", immediateRender: false }, fin);
      });
    }
    // Se ordenan de menor a mayor: Juli, Tano, Mica, Rulo
    tl.fromTo("#ti-t2", { scale: 1.15 }, { scale: 1, duration: 0.27, ease: "back.out(2.2)" }, 2.6);
    tl.fromTo("#ti-f4", { y: 0 }, { y: -540, duration: 0.5, ease: "power3.inOut" }, 2.6);
    tl.fromTo("#ti-f1", { y: 0 }, { y: 180, duration: 0.5, ease: "power3.inOut" }, 2.6);
    tl.fromTo("#ti-f3", { y: 0 }, { y: 0, duration: 0.5, ease: "power3.inOut" }, 2.6);
    tl.fromTo("#ti-f2", { y: 0 }, { y: 360, duration: 0.5, ease: "power3.inOut" }, 2.6);
    // El primer dado de cada fila toma el color de la tarea que le va a tocar
    [["#ti-f4", "#cc66ff"], ["#ti-f1", "#00cccc"], ["#ti-f3", "#ea2a58"]].forEach(([fila, color], i) => {
      const d = `${fila} .dado:first-child`;
      tl.set(d, { backgroundColor: color }, 3.2 + i * 0.25);
      tl.set(`${d} i.on`, { backgroundColor: "#ffffff" }, 3.2 + i * 0.25);
      tl.fromTo(d, { scale: 1.25 }, { scale: 1, duration: 0.27, ease: "back.out(2.2)", immediateRender: false }, 3.2 + i * 0.25);
    });
    tl.fromTo("#ti-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power4.out" }, 3.2);
    window.__timelines["tirada"] = tl;
  </script>
</template>
