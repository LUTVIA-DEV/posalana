  <script>
    const PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
    document.querySelectorAll("#lo-f1 .dado, #lo-f2 .dado").forEach((d) => {
      const n = Number(d.dataset.v);
      let h = "";
      for (let i = 0; i < 9; i++) h += PIPS[n].includes(i) ? '<i class="on"></i>' : "<i></i>";
      d.innerHTML = '<div class="cara">' + h + "</div>";
    });
    // Lluvia de lomitos y papas, como el easter egg de la app (posiciones sembradas)
    const lluvia = document.getElementById("lo-lluvia");
    let s = 17;
    const azar = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    const gotas = [];
    for (let i = 0; i < 22; i++) {
      const g = document.createElement("div");
      g.className = "lo-cae";
      g.textContent = i % 3 === 2 ? "🍟" : "🥪";
      g.style.left = Math.round(40 + (i / 22) * 1760 + azar() * 60) + "px";
      lluvia.appendChild(g);
      gotas.push({ g, demora: azar() * 1.6, giro: (azar() - 0.5) * 540, dur: 1.2 + azar() * 0.8 });
    }

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#lo-pregunta", { scale: 1.15 }, { scale: 1, duration: 0.27, ease: "back.out(2.2)" }, 0);
    tl.fromTo("#lo-f1", { x: -1700 }, { x: 0, duration: 0.4, ease: "power4.out" }, 0.4);
    tl.fromTo("#lo-f2", { x: 1700 }, { x: 0, duration: 0.4, ease: "power4.out" }, 0.9);
    // Los dados iguales se marcan de a pares, uno por golpe
    for (let k = 1; k <= 4; k++) {
      const par = `#lo-f1 .dado:nth-child(${k}), #lo-f2 .dado:nth-child(${k})`;
      tl.set(par, { backgroundColor: "#cc66ff" }, 1.3 + (k - 1) * 0.15);
      tl.set(`#lo-f1 .dado:nth-child(${k}) i.on, #lo-f2 .dado:nth-child(${k}) i.on`, { backgroundColor: "#ffffff" }, 1.3 + (k - 1) * 0.15);
      tl.fromTo(par, { scale: 1.25 }, { scale: 1, duration: 0.2, ease: "back.out(2.2)" }, 1.3 + (k - 1) * 0.15);
    }
    // Chocan
    tl.to("#lo-f1", { y: 125, duration: 0.2, ease: "power3.in" }, 2.25);
    tl.to("#lo-f2", { y: -125, duration: 0.2, ease: "power3.in" }, 2.25);
    // ¡Lomito!

    tl.fromTo("#lo-titulo", { scale: 1.4 }, { scale: 1, duration: 0.3, ease: "back.out(2.2)" }, 2.55);

    const num = { v: 47 };
